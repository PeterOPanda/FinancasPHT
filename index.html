<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Finanças</title>
<style>
  :root{ --sans:"Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
    --mono:"Cascadia Mono",Consolas,"JetBrains Mono",ui-monospace,monospace; }
  :root{
    --bg:#f4f2ee; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6862; --line:#e3dfd8;
    --accent:#c4621c; --accent-soft:#fbeadc; --warn:#a33a2a; --warn-soft:#f6e4e0; --ok:#2e7d4f;
    --c1:#c4621c; --c2:#1f5f5b; --c3:#6b8fb3; --c4:#a35d7a; --c5:#7a9a4a; --c6:#b5654a; --c7:#5f5b8f; --c8:#8a8378;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161615; --card:#21211f; --ink:#f1efe9; --muted:#a09d96; --line:#34332f;
      --accent:#f29a4a; --accent-soft:#3a2617; --warn:#ef8d7c; --warn-soft:#3a2521; --ok:#7fcf9c;
      --c1:#f29a4a; --c2:#6cc2b8; --c3:#8fb3d9; --c4:#d48fae; --c5:#a8c77a; --c6:#e0907a; --c7:#a19ce0; --c8:#b3ada3; }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  /* topo + menu (igual à calculadora) */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:12px;position:relative}
  .top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
  .menu-btn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;display:grid;place-items:center;cursor:pointer}
  .menu-btn svg{width:22px;height:22px}
  .menu-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
  .menu{position:absolute;top:52px;left:0;z-index:11;width:min(320px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.15);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .15s,transform .15s}
  .open .menu-bg{opacity:1;pointer-events:auto}
  .open .menu{opacity:1;transform:none;pointer-events:auto}
  .tab{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:10px;border-radius:10px;cursor:pointer;font:inherit}
  .tab .ic{width:36px;height:36px;flex:none;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--accent);font:700 14px var(--sans)}
  .tab b{display:block;font-weight:600;font-size:15px}
  .tab small{display:block;color:var(--muted);font-size:12.5px}
  .tab[aria-current="true"]{background:var(--accent-soft)}
  .tab[aria-current="true"] .ic{background:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .tab[aria-current="true"] .ic{color:#2a1606} }
  .sep{height:1px;background:var(--line);margin:6px 8px}
  /* mês */
  .month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .month button{width:44px;height:38px;border:0;background:transparent;color:var(--accent);font:600 22px var(--sans);border-radius:9px;cursor:pointer}
  .month span{font-weight:600;font-size:15px}
  /* cartões e campos */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:600}
  .card h2 small{font-weight:400;color:var(--muted);font-size:13px}
  .panel{display:none}.panel.on{display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  .grid>div{min-width:0}
  .field{min-width:0;width:100%}
  input[type=date],input[type=month]{display:block;max-width:100%}
  label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:6px}
  .field{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .field span{padding:0 0 0 12px;color:var(--muted);font-size:14px;white-space:nowrap}
  input,select{border:0;background:transparent;color:var(--ink);font:500 16px var(--sans);padding:11px 12px;width:100%;min-width:0;outline:none;-webkit-appearance:none;appearance:none}
  input[type=date],input[type=month]{min-height:44px}
  select{cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  /* lista de opções ao selecionar: sempre letra preta em fundo claro */
  select option,select optgroup{color:#1d1d1b;background:#ffffff}
  .money input{font-family:var(--mono);font-weight:600}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{border:1px solid var(--line);background:transparent;color:var(--ink);font:500 13px var(--sans);padding:7px 12px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .seg button.on{color:#2a1606} }
  .check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer;margin:0}
  .check input{width:22px;height:22px;padding:0;flex:none;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);position:relative;cursor:pointer}
  .check input:checked{background:var(--accent);border-color:var(--accent)}
  .check input:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;border:1px solid var(--accent);background:var(--accent);color:#fff;font:600 15px var(--sans);padding:12px;border-radius:10px;cursor:pointer}
  @media (prefers-color-scheme: dark){ .btn{color:#2a1606} }
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.del{background:transparent;border-color:var(--line);color:var(--warn);flex:none;padding:12px 14px}
  .linkbtn{border:0;background:none;color:var(--accent);font:500 13px var(--sans);cursor:pointer;padding:4px 0}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
  /* listas */
  .lhead{display:flex;gap:10px;justify-content:space-between;align-items:baseline;margin:4px 2px 8px;font-size:13px;font-weight:600;color:var(--muted)}
  .lhead b{font:600 14px var(--mono);color:var(--ink)}
  .list{list-style:none;margin:0 0 14px;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .list li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .list li:last-child{border-bottom:0}
  .list li.tap{cursor:pointer}
  .list li.editing{background:var(--accent-soft)}
  .list .g{flex:1;min-width:0}
  .list .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .v{font:600 14.5px var(--mono);white-space:nowrap;text-align:right}
  .list .v.in{color:var(--ok)}
  .list li.empty{color:var(--muted);justify-content:center;font-size:14px;padding:18px}
  .list li.day{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);padding:6px 14px}
  .pill{display:inline-block;font:600 11px var(--sans);padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);margin-left:4px;vertical-align:1px}
  .pill.ok{background:var(--accent-soft);color:var(--accent)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .mini{width:118px;flex:none}
  .mini input{padding:8px 8px 8px 4px;font:600 14px var(--mono);text-align:right}
  .mini span{font-size:12px;padding-left:8px}
  /* resultado */
  .result{padding:16px 18px;border-radius:12px;background:var(--accent-soft);margin-bottom:12px}
  .result .lbl{font-size:13px;color:var(--muted)}
  .result .val{font:600 30px var(--mono);color:var(--accent)}
  .result.neg .val{color:var(--warn)}
  .result.neg{background:var(--warn-soft)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
  .stat .lbl{font-size:12px;color:var(--muted)}
  .stat .v{font:600 16px var(--mono);margin-top:2px}
  .bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line)}
  .bar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
  .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .rows .r{padding:9px 0;border-bottom:1px solid var(--line)}
  .rows .r:last-child{border-bottom:0}
  .rows .rt{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:6px}
  .rows .rt span:last-child{font:600 14px var(--mono);white-space:nowrap}
  .rows .rt small{color:var(--muted);font:400 12px var(--sans);margin-left:6px}
  .rows .bar{height:6px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--sans);padding:7px 11px;border-radius:999px;cursor:pointer}
  .tags button.add{color:var(--accent);border-style:dashed;border-color:var(--accent)}
  /* diálogo e aviso */
  .dlg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:24px}
  .dlg .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .dlg p{margin:0 0 12px;font-size:15.5px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;transition:opacity .3s;white-space:nowrap}
  @media (max-width:520px){
    .wrap{padding:16px 12px 40px}
    .top h1{font-size:20px}
    .card{padding:14px;border-radius:14px}
    .grid{gap:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 id="title">Resultado do mês</h1>
    <div class="menu-bg" id="menuBg"></div>
    <nav class="menu" id="menu">
      <button class="tab" data-tab="entradas"><span class="ic">+R$</span><span><b>Entradas</b><small>Salário, projetos, comissões</small></span></button>
      <button class="tab" data-tab="fixas"><span class="ic">↻</span><span><b>Gastos fixos</b><small>Assinaturas, casa, financiamento</small></span></button>
      <button class="tab" data-tab="parcelas"><span class="ic">1/n</span><span><b>Compras parceladas</b><small>Parcelas por cartão</small></span></button>
      <button class="tab" data-tab="gastos"><span class="ic">−R$</span><span><b>Gastos gerais</b><small>Por categoria e forma de pagamento</small></span></button>
      <button class="tab" data-tab="financ"><span class="ic">⌂</span><span><b>Financiamento</b><small>Parcelas, saldo devedor e quanto falta</small></span></button>
      <button class="tab" data-tab="cartoes"><span class="ic">▭</span><span><b>Cartões de crédito</b><small>Gerais + fixos + parcelas por cartão</small></span></button>
      <button class="tab" data-tab="contas"><span class="ic">✓</span><span><b>Contas gerais</b><small>Marcar o que já foi pago</small></span></button>
      <button class="tab" data-tab="resultado"><span class="ic">Σ</span><span><b>Resultado do mês</b><small>Receitas, gastos e sobra</small></span></button>
      <div class="sep"></div>
      <button class="tab" data-tab="ajustes"><span class="ic">⚙</span><span><b>Ajustes</b><small>Categorias, pagamentos, backup</small></span></button>
    </nav>
  </header>

  <div class="month" id="monthBar">
    <button onclick="A.mes(-1)" aria-label="Mês anterior">‹</button>
    <span id="monthLbl"></span>
    <button onclick="A.mes(1)" aria-label="Próximo mês">›</button>
  </div>

  <section class="panel" id="entradas"></section>
  <section class="panel" id="fixas"></section>
  <section class="panel" id="parcelas"></section>
  <section class="panel" id="gastos"></section>
  <section class="panel" id="financ"></section>
  <section class="panel" id="cartoes"></section>
  <section class="panel" id="contas"></section>
  <section class="panel" id="resultado"></section>
  <section class="panel" id="ajustes"></section>
</div>

<script>
'use strict';
const KEY='financasPHT_v2';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const TITULOS={entradas:'Entradas',fixas:'Gastos fixos',parcelas:'Compras parceladas',gastos:'Gastos gerais',financ:'Financiamento',cartoes:'Cartões de crédito',contas:'Contas gerais',resultado:'Resultado do mês',ajustes:'Ajustes'};
const CORES=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];

/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const r2=v=>Math.round(v*100)/100;
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const hoje=()=>{const t=new Date();return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};
function addMes(ym,n){const[y,m]=ym.split('-').map(Number);const t=new Date(y,m-1+n,1);return `${t.getFullYear()}-${pad(t.getMonth()+1)}`}
function difMes(a,b){const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)}
const nomeMes=ym=>{const[y,m]=ym.split('-').map(Number);return `${MESES[m-1]} ${y}`};
const curto=ym=>{const[y,m]=ym.split('-').map(Number);return `${MES3[m-1]}/${String(y).slice(2)}`};
const dataBR=d=>d.split('-').reverse().join('/');
const fmt=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lerValor(s){s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isFinite(v)?r2(v):0}
function dataPadrao(){const h=hoje();if(h.slice(0,7)===UI.mes)return h;const[y,m]=UI.mes.split('-').map(Number);return `${UI.mes}-${pad(Math.min(+h.slice(8),lastDay(y,m)))}`}

/* ---------- dados ---------- */
function padrao(){return{v:2,
  entradas:[],gastos:[],parcelas:[],fixas:[],fixMes:{},guardado:{},cartPago:{},financ:[],finMes:{},
  catEnt:['Salário / Pró-labore','Projetos','Comissões','Rendimentos','Reembolso','Sobra do mês anterior','Outros'],
  cats:['Mercado','Alimentação','Transporte','Combustível','Saúde','Farmácia','Casa','Contas de casa','Assinaturas','Financiamento','Lazer','Vestuário','Educação','Pets','Presentes','Trabalho','Impostos','Outros'],
  formas:[{id:'pix',nome:'Pix',cartao:false},{id:'deb',nome:'Débito',cartao:false},{id:'din',nome:'Dinheiro',cartao:false},{id:'bol',nome:'Boleto',cartao:false},{id:'dauto',nome:'Débito automático',cartao:false}]
}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||padrao()}catch(e){S=padrao()}
const CAT_SOBRA='Sobra do mês anterior';
function migrar(){S=Object.assign(padrao(),S);if(!S.guardado)S.guardado={};if(!S.catEnt.includes(CAT_SOBRA))S.catEnt.splice(Math.max(0,S.catEnt.length-1),0,CAT_SOBRA)}
migrar();
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

let UI={tab:'resultado',mes:hoje().slice(0,7),edit:{}};
try{const t=localStorage.getItem('fin-tab');if(t&&TITULOS[t])UI.tab=t}catch(e){}

const forma=id=>S.formas.find(f=>f.id===id)||{nome:'—',cartao:false};
const cartoes=()=>S.formas.filter(f=>f.cartao);
const nomePag=id=>{const f=forma(id);return f.cartao?'Crédito · '+f.nome:f.nome};

/* ---------- regras de cálculo ---------- */
// parcela k (1..n) de uma compra; a última absorve o arredondamento
function valorParcela(p,k){const base=p.modo==='parcela'?p.valor:Math.floor(p.valor/p.n*100)/100;if(p.modo==='parcela')return base;return k===p.n?r2(p.valor-base*(p.n-1)):base}
function parcelaNoMes(p,ym){const k=difMes(p.inicio,ym)+1;return k>=1&&k<=p.n?k:0}
const totalCompra=p=>p.modo==='parcela'?r2(p.valor*p.n):p.valor;
const fixaAtiva=(f,ym)=>(!f.inicio||f.inicio<=ym)&&(!f.fim||f.fim>=ym);
function regFixa(f,ym){return (S.fixMes[ym]||{})[f.id]||{}}
// valor do mês: o digitado no mês; se for variável e ainda não digitado, usa o último valor conhecido (estimativa)
function valorFixa(f,ym){const r=regFixa(f,ym);if(r.v!=null)return{v:r.v,est:false};
  if(f.variavel){const ms=Object.keys(S.fixMes).filter(m=>m<ym&&S.fixMes[m][f.id]&&S.fixMes[m][f.id].v!=null).sort();if(ms.length)return{v:S.fixMes[ms.at(-1)][f.id].v,est:true}}
  return{v:f.valor,est:!!f.variavel}}
// financiamento: parcela k do mês, valor digitado no mês ou último conhecido
const parcFin=(f,ym)=>{const k=difMes(f.inicio,ym)+1;return k>=1&&k<=f.n?k:0};
const regFin=(f,ym)=>(S.finMes[ym]||{})[f.id]||{};
// juros: taxa mensal equivalente
const taxaMes=f=>!f.juros?0:f.jurosTipo==='am'?f.juros/100:Math.pow(1+f.juros/100,1/12)-1;
// ponto de partida: último saldo devedor informado antes do mês; senão, o valor financiado
function baseFin(f,ym){const ms=Object.keys(S.finMes).filter(m=>m<ym&&parcFin(f,m)&&S.finMes[m][f.id]&&S.finMes[m][f.id].saldo!=null).sort();
  if(ms.length){const m0=ms.at(-1);return{S0:S.finMes[m0][f.id].saldo,rem:f.n-parcFin(f,m0),j:difMes(m0,ym)}}
  if(f.financiado)return{S0:f.financiado,rem:f.n,j:difMes(f.inicio,ym)+1};return null}
// parcela e saldo após o pagamento, aproximados (sem TR/IPCA)
function calcFin(f,ym){const i=taxaMes(f),b=baseFin(f,ym);if(!i||!b||b.rem<=0||b.j<1||b.j>b.rem)return null;
  let parc,saldo;
  if(f.sistema==='Price'){const pmt=b.S0*i/(1-Math.pow(1+i,-b.rem));parc=pmt;saldo=b.S0*Math.pow(1+i,b.j)-pmt*(Math.pow(1+i,b.j)-1)/i}
  else{const A=b.S0/b.rem,antes=b.S0-A*(b.j-1);parc=A+antes*i;saldo=antes-A}
  return{v:r2(parc+(f.extras||0)),saldo:r2(Math.max(0,saldo))}}
function valorFin(f,ym){const r=regFin(f,ym);if(r.v!=null)return{v:r.v,est:false};const c=calcFin(f,ym);if(c)return{v:c.v,est:true,calc:true};const ms=Object.keys(S.finMes).filter(m=>m<ym&&S.finMes[m][f.id]&&S.finMes[m][f.id].v!=null).sort();return{v:ms.length?S.finMes[ms.at(-1)][f.id].v:f.valor,est:true}}
function saldoFin(f,ym){const ms=Object.keys(S.finMes).filter(m=>m<=ym&&S.finMes[m][f.id]&&S.finMes[m][f.id].saldo!=null).sort();return ms.length?{v:S.finMes[ms.at(-1)][f.id].saldo,de:ms.at(-1)}:null}
// em qual fatura (mês de pagamento) cai uma compra no cartão feita na data d
// sem dia de fechamento: compra do mês vai para a fatura do mês seguinte
function faturaDe(cid,d){const c=forma(cid),ym=d.slice(0,7),dia=+d.slice(8,10);
  if(!c.fech)return addMes(ym,1);
  const fecha=dia>=c.fech?addMes(ym,1):ym;           // compra no dia do fechamento ou depois vai para o próximo ciclo
  const vencDepois=c.venc?c.venc>c.fech:c.fech<15;    // vencimento no mesmo mês do fechamento?
  return vencDepois?fecha:addMes(fecha,1)}
// cobranças de fixos no cartão que caem na fatura ym (cobrança no mês anterior ou no próprio mês)
function fixosNaFatura(f,ym){const out=[];[addMes(ym,-1),ym].forEach(m=>{if(fixaAtiva(f,m)&&faturaDe(f.pag,vencData(m,f.dia||1))===ym)out.push(m)});return out}
function gastosDoMes(ym){
  const out=[];
  // no crédito, o gasto conta no mês em que a fatura é paga
  S.gastos.forEach(g=>{if((ehCartao(g.pag)?faturaDe(g.pag,g.data):g.data.slice(0,7))===ym)out.push({tipo:'Gerais',valor:g.valor,cat:g.cat,pag:g.pag})});
  S.fixas.forEach(f=>{if(ehCartao(f.pag))fixosNaFatura(f,ym).forEach(m=>out.push({tipo:'Fixos',valor:valorFixa(f,m).v,cat:f.cat,pag:f.pag}));else if(fixaAtiva(f,ym))out.push({tipo:'Fixos',valor:valorFixa(f,ym).v,cat:f.cat,pag:f.pag})});
  S.parcelas.forEach(p=>{const k=parcelaNoMes(p,ym);if(k)out.push({tipo:'Parcelados',valor:valorParcela(p,k),cat:p.cat,pag:p.pag})});
  S.financ.forEach(f=>{if(parcFin(f,ym))out.push({tipo:'Financiamento',valor:valorFin(f,ym).v,cat:'Financiamento',pag:f.pag})});
  return out;
}
// guardado: valor digitado no mês ou, se não houver, o último informado antes
function guardadoMes(ym){if(S.guardado[ym]!=null)return{v:S.guardado[ym],de:ym};const ms=Object.keys(S.guardado).filter(m=>m<ym).sort();return ms.length?{v:S.guardado[ms.at(-1)],de:ms.at(-1)}:{v:null,de:null}}
const sobraLevada=ym=>S.entradas.find(e=>e.sobraDe===ym);
// tudo que caiu em um cartão no mês: gastos gerais + fixos + parcelas
function itensCartao(cid,ym){const out=[];
  S.gastos.forEach(g=>{if(g.pag===cid&&faturaDe(cid,g.data)===ym)out.push({tipo:'Gerais',desc:g.desc||g.cat,sub:'Compra '+dataBR(g.data).slice(0,5)+' · '+g.cat,valor:g.valor,data:g.data})});
  S.fixas.forEach(f=>{if(f.pag===cid)fixosNaFatura(f,ym).forEach(m=>out.push({tipo:'Fixos',desc:f.nome,sub:'Fixo de '+curto(m)+' · '+f.cat,valor:valorFixa(f,m).v}))});
  S.parcelas.forEach(p=>{const k=parcelaNoMes(p,ym);if(p.pag===cid&&k)out.push({tipo:'Parcelados',desc:p.desc,sub:`Parcela ${k}/${p.n} · ${p.cat}`,valor:valorParcela(p,k)})});
  S.financ.forEach(f=>{const k=parcFin(f,ym);if(f.pag===cid&&k)out.push({tipo:'Parcelados',desc:f.nome,sub:`Financiamento ${k}/${f.n}`,valor:valorFin(f,ym).v})});
  return out}
const cartaoPago=(cid,ym)=>!!(S.cartPago[ym]||{})[cid];
const ehCartao=id=>forma(id).cartao;
// contas a pagar no mês: faturas dos cartões + fixos fora do crédito
function vencData(ym,dia){if(!dia)return null;const[y,m]=ym.split('-').map(Number);return `${ym}-${pad(Math.min(dia,lastDay(y,m)))}`}
function contasDoMes(ym){
  const cs=cartoes().map(c=>{const its=itensCartao(c.id,ym);return{tipo:'cartao',id:c.id,nome:'Fatura '+c.nome,valor:soma(its),pago:cartaoPago(c.id,ym),n:its.length,dia:c.venc||null,sub:`${its.length} ite${its.length>1?'ns':'m'} no cartão`}}).filter(c=>c.valor>0);
  const fs=S.fixas.filter(f=>fixaAtiva(f,ym)&&!ehCartao(f.pag)).map(f=>{const vf=valorFixa(f,ym);return{tipo:'fixa',id:f.id,nome:f.nome,dia:f.dia,valor:vf.v,est:vf.est,pago:!!regFixa(f,ym).pago,sub:nomePag(f.pag)}});
  const fn=S.financ.filter(f=>parcFin(f,ym)&&!ehCartao(f.pag)).map(f=>{const vf=valorFin(f,ym);return{tipo:'fin',id:f.id,nome:f.nome,dia:f.dia,valor:vf.v,est:vf.est,pago:!!regFin(f,ym).pago,sub:`Parcela ${parcFin(f,ym)}/${f.n} · ${nomePag(f.pag)}`}});
  const todas=[...cs,...fs,...fn].map(c=>({...c,venc:vencData(ym,c.dia)})).sort((a,b)=>(a.venc||'9999').localeCompare(b.venc||'9999'));
  return{cs,fs:[...fs,...fn],todas}}
const entradasDoMes=ym=>S.entradas.filter(e=>e.data.slice(0,7)===ym);
const soma=(arr,f=x=>x.valor)=>r2(arr.reduce((s,x)=>s+f(x),0));

/* ---------- interface ---------- */
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),300)},1700)}
function confirmar(msg,ok,txt='Excluir'){const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box"><p>${esc(msg)}</p><div class="btns"><button class="btn ghost" data-n>Cancelar</button><button class="btn" style="background:var(--warn);border-color:var(--warn)" data-s>${txt}</button></div></div>`;
  d.querySelector('[data-n]').onclick=()=>d.remove();d.querySelector('[data-s]').onclick=()=>{d.remove();ok()};d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}
function perguntar(msg,valor,ok){const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box"><p>${esc(msg)}</p><div class="field"><input value="${esc(valor||'')}"></div><div class="btns"><button class="btn ghost" data-n>Cancelar</button><button class="btn" data-s>OK</button></div></div>`;
  const i=d.querySelector('input');const fim=()=>{const v=i.value.trim();d.remove();if(v)ok(v)};
  d.querySelector('[data-n]').onclick=()=>d.remove();d.querySelector('[data-s]').onclick=fim;i.onkeydown=e=>{if(e.key==='Enter')fim()};document.body.appendChild(d);setTimeout(()=>i.focus(),50)}

const top_=$('top'),menuBtn=$('menuBtn');

  const fora=ativas.filter(x=>!ehCartao(x.pag)),totFora=soma(fora,x=>valorFixa(x,UI.mes).v),totCred=r2(tot-totFora);
  const pagos=soma(fora.filter(x=>regFixa(x,UI.mes).pago),x=>valorFixa(x,UI.mes).v);

  return `<div class="card"><h2>${f?'Editar gasto fixo':'Novo gasto fixo'}</h2><div class="grid">

  </div>${botoes('fix',id)}</div>
  <div class="lhead"><span>Fixos de ${nomeMes(UI.mes).toLowerCase()} · ✓ pago · ▭ no cartão</span><b>${fmt(tot)}</b></div>
  <ul class="list">${ativas.length?ativas.map(linha).join(''):'<li class="empty">Nenhum gasto fixo cadastrado</li>'}</ul>

function blocoRanking(titulo,mapa,total){
  const arr=Object.entries(mapa).sort((a,b)=>b[1]-a[1]);
  if(!arr.length)return '';

function blocoSobra(ym,sobra){const l=sobraLevada(ym),prox=nomeMes(addMes(ym,1)).toLowerCase();

function blocoGuardado(ym){const g=guardadoMes(ym),ant=guardadoMes(addMes(ym,-1)),herdado=g.v!=null&&g.de!==ym;

    <div class="btns" style="margin-top:8px"><button class="btn ghost" onclick="A.csv()">Exportar para Excel (.csv)</button></div>
    <div class="btns" style="margin-top:8px"><button class="btn del" style="flex:1" onclick="A.zerar()">Apagar todos os dados</button></div></div>
  <div class="hint" style="text-align:center">${S.entradas.length} entradas · ${S.gastos.length} gastos · ${S.fixas.length} fixos · ${S.parcelas.length} parceladas</div>`;
}

/* ---------- ações ---------- */
const LISTA={ent:'entradas',gas:'gastos',fix:'fixas',par:'parcelas'};
const A={
  ir(t){UI.tab=t;UI.edit={};UI.modoParc=null;try{localStorage.setItem('fin-tab',t)}catch(e){}window.scrollTo(0,0);render();if(t==='parcelas')A.prevParc()},
  mes(n){UI.mes=addMes(UI.mes,n);UI.edit={};render();if(UI.tab==='parcelas')A.prevParc()},
  editar(tipo,id){UI.edit[tipo]=UI.edit[tipo]===id?null:id;UI.modoParc=null;render();window.scrollTo({top:0,behavior:'smooth'});if(tipo==='par')A.prevParc()},
  cancelar(tipo){UI.edit[tipo]=null;UI.modoParc=null;render();if(tipo==='par')A.prevParc()},
  excluir(tipo,id){const msg=tipo==='par'?'Excluir esta compra e todas as parcelas?':tipo==='fix'?'Excluir este gasto fixo de todos os meses?':'Excluir este lançamento?';
    confirmar(msg,()=>{S[LISTA[tipo]]=S[LISTA[tipo]].filter(x=>x.id!==id);if(tipo==='fix')Object.values(S.fixMes).forEach(m=>delete m[id]);UI.edit[tipo]=null;salvar();render();A.prevParc()})},
  salvar(tipo){
    const id=UI.edit[tipo];let o;
    if(tipo==='ent'){const v=lerValor($('ev').value);if(!v)return toast('Informe o valor');
      o={valor:v,data:$('ed').value||dataPadrao(),desc:$('eds').value.trim(),cat:$('ec').value}}
    if(tipo==='gas'){const v=lerValor($('gv').value);if(!v)return toast('Informe o valor');
      o={valor:v,data:$('gd').value||dataPadrao(),desc:$('gds').value.trim(),cat:$('gc').value,pag:$('gp').value};UI.ultCat=o.cat;UI.ultPag=o.pag}
    if(tipo==='fix'){const nm=$('fn').value.trim();if(!nm)return toast('Informe o nome');const v=lerValor($('fv').value);if(!v)return toast('Informe o valor');
      const dia=parseInt($('fdia').value,10);o={nome:nm,valor:v,dia:dia>=1&&dia<=31?dia:null,cat:$('fc').value,pag:$('fp').value,inicio:$('fini').value||UI.mes,fim:$('ffim').value||null,variavel:$('fvar').checked};
      if(o.fim&&o.fim<o.inicio)return toast('O fim é antes do início')}
    if(tipo==='par'){const d=$('pd').value.trim();if(!d)return toast('Informe o que foi comprado');const v=lerValor($('pv').value);if(!v)return toast('Informe o valor');
      o={desc:d,valor:v,modo:UI.modoParc||(id?S.parcelas.find(x=>x.id===id).modo:'total'),n:+$('pn').value,pag:$('pp').value,inicio:$('pi').value||UI.mes,cat:$('pc').value}}
    if(id)Object.assign(S[LISTA[tipo]].find(x=>x.id===id),o);else S[LISTA[tipo]].push({id:uid(),criado:Date.now(),...o});
    UI.edit[tipo]=null;UI.modoParc=null;salvar();render();A.prevParc();toast(id?'Alterado':'Adicionado');
  },
  pagarConta(tipo,id,ok){if(tipo==='fixa')return A.pagoFixa(id,ok);if(tipo==='fin')return A.finPago(id,ok);const m=S.cartPago[UI.mes]=S.cartPago[UI.mes]||{};if(ok)m[id]=true;else delete m[id];salvar();render()},
  vencCartao(id){const c=forma(id),d=document.createElement('div');d.className='dlg';
    d.innerHTML=`<div class="box"><p>${esc(c.nome)}</p><div class="grid"><div><label>Dia do fechamento</label><div class="field"><input id="cdf" inputmode="numeric" placeholder="Ex.: 26" value="${c.fech||''}"></div></div><div><label>Dia do vencimento</label><div class="field"><input id="cdv" inputmode="numeric" placeholder="Ex.: 5" value="${c.venc||''}"></div></div></div>
      <div class="hint">Compras a partir do dia do fechamento entram na fatura seguinte. Sem fechamento informado, toda compra do mês vai para a fatura do mês seguinte.</div><div class="btns"><button class="btn ghost" data-n>Cancelar</button><button class="btn" data-s>Salvar</button></div></div>`;
    d.querySelector('[data-n]').onclick=()=>d.remove();d.querySelector('[data-s]').onclick=()=>{const f=parseInt(d.querySelector('#cdf').value,10),v=parseInt(d.querySelector('#cdv').value,10);c.fech=f>=1&&f<=31?f:null;c.venc=v>=1&&v<=31?v:null;d.remove();salvar();render()};document.body.appendChild(d)},
  novoFin(){UI.finForm=true;UI.edit.fin=null;render();window.scrollTo(0,0)},
  editarFin(id){UI.edit.fin=id;UI.finForm=false;render();window.scrollTo({top:0,behavior:'smooth'})},
  fecharFin(){UI.edit.fin=null;UI.finForm=false;render()},
  salvarFin(){const id=UI.edit.fin,nome=$('nn').value.trim();if(!nome)return toast('Informe o nome');
    const n=parseInt($('nnp').value,10),k=parseInt($('nka').value,10),dia=parseInt($('nd').value,10),juros=lerValor($('nj').value),fin=lerValor($('nvf').value);let v=lerValor($('nv').value);
    if(!(n>0))return toast('Informe o nº total de parcelas');if(!(k>=1&&k<=n))return toast('Parcela atual deve ser entre 1 e '+n);const tmp={n,inicio:addMes(UI.mes,-(k-1)),financiado:fin||null,juros,jurosTipo:$('njt').value,sistema:$('ns').value,extras:lerValor($('nx').value),id:id||'_'};
    if(!v){const c=calcFin(tmp,UI.mes);if(c)v=c.v;else return toast('Informe o valor da parcela, ou taxa de juros + valor financiado')}
    const o={nome,n,valor:v,juros:juros||null,jurosTipo:$('njt').value,extras:lerValor($('nx').value)||0,financiado:fin||null,inicio:addMes(UI.mes,-(k-1)),dia:dia>=1&&dia<=31?dia:null,sistema:$('ns').value,pag:$('np').value};
    if(id)Object.assign(S.financ.find(x=>x.id===id),o);else S.financ.push({id:uid(),...o});
    A.fecharFin();salvar();render();toast(id?'Alterado':'Financiamento adicionado')},
  excluirFin(id){confirmar('Excluir este financiamento e todo o histórico de parcelas?',()=>{S.financ=S.financ.filter(x=>x.id!==id);Object.values(S.finMes).forEach(m=>delete m[id]);A.fecharFin();salvar();render()})},
  finMes(id,campo,txt){const m=S.finMes[UI.mes]=S.finMes[UI.mes]||{},r=m[id]=m[id]||{};const t=String(txt).trim();if(!t)delete r[campo];else r[campo]=lerValor(t);salvar();render()},
  finPago(id,ok){const m=S.finMes[UI.mes]=S.finMes[UI.mes]||{},r=m[id]=m[id]||{};r.pago=ok;if(ok&&r.v==null)r.v=valorFin(S.financ.find(f=>f.id===id),UI.mes).v;salvar();render()},
  trazerFixa(fid){const fx=S.fixas.find(x=>x.id===fid);
    const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box"><p>Transferir <b>${esc(fx.nome)}</b></p><div class="grid"><div><label>Nº total de parcelas</label><div class="field"><input id="tn" inputmode="numeric" placeholder="Ex.: 360"></div></div><div><label>Parcela de ${curto(UI.mes)}</label><div class="field"><input id="tk" inputmode="numeric" placeholder="Ex.: 25"></div></div></div>
      <div class="btns"><button class="btn ghost" data-n>Cancelar</button><button class="btn" data-s>Transferir</button></div></div>`;
    d.querySelector('[data-n]').onclick=()=>d.remove();
    d.querySelector('[data-s]').onclick=()=>{const n=parseInt(d.querySelector('#tn').value,10),k=parseInt(d.querySelector('#tk').value,10);if(!(n>0&&k>=1&&k<=n))return toast('Confira os números');d.remove();
      const f={id:uid(),nome:fx.nome,n,valor:valorFixa(fx,UI.mes).v,financiado:null,inicio:addMes(UI.mes,-(k-1)),dia:fx.dia,sistema:'Outro',pag:fx.pag};S.financ.push(f);
      Object.entries(S.fixMes).forEach(([m,o])=>{if(o[fid]){(S.finMes[m]=S.finMes[m]||{})[f.id]={...o[fid]};delete o[fid]}});
      S.fixas=S.fixas.filter(x=>x.id!==fid);salvar();render();toast('Transferido')};
    document.body.appendChild(d)},
  valorFixaMes(id,s){const v=lerValor(s);const m=S.fixMes[UI.mes]=S.fixMes[UI.mes]||{};m[id]=Object.assign(m[id]||{},{v});salvar();render()},
  pagoFixa(id,ok){const m=S.fixMes[UI.mes]=S.fixMes[UI.mes]||{};const r=m[id]=m[id]||{};r.pago=ok;
    // ao marcar como pago, fixa o valor do mês (deixa de ser estimativa)
    if(ok&&r.v==null)r.v=valorFixa(S.fixas.find(f=>f.id===id),UI.mes).v;salvar();render()},
  modoParc(m){const keep={pd:$('pd').value,pv:$('pv').value,pn:$('pn').value,pp:$('pp').value,pi:$('pi').value,pc:$('pc').value};UI.modoParc=m;render();
    Object.entries(keep).forEach(([k,v])=>{if(k==='pv'){const n=+keep.pn,val=lerValor(v);$(k).value=val?num(m==='parcela'?r2(val/n):r2(val*n)):''}else $(k).value=v});A.prevParc()},
  gfat(){const el=$('gfat');if(!el)return;const p=$('gp').value,d=$('gd').value;if(!ehCartao(p)||!d){el.textContent='';return}
    const ym=faturaDe(p,d),c=forma(p);el.innerHTML=`Entra na fatura de <b>${nomeMes(ym).toLowerCase()}</b>${c.venc?' (vence '+dataBR(vencData(ym,c.venc)).slice(0,5)+')':''}${c.fech?'':' · <button class="linkbtn" onclick="A.vencCartao(\''+p+'\')">informar fechamento</button>'}`},
  prevParc(){const el=$('pprev');if(!el||UI.tab!=='parcelas')return;$('pv').oninput=A.prevParc;
    const v=lerValor($('pv').value),n=+$('pn').value,ini=$('pi').value||UI.mes,modo=UI.modoParc||(UI.edit.par?S.parcelas.find(x=>x.id===UI.edit.par).modo:'total');
    if(!v){el.textContent='';return}const p={valor:v,n,modo};
    el.innerHTML=`${n}× de <b>${fmt(valorParcela(p,1))}</b> · total ${fmt(totalCompra(p))} · de ${curto(ini)} até ${curto(addMes(ini,n-1))}`},
  novaCatSel(sel,tipo){if(sel.value!=='__nova')return;const lista=tipo==='ent'?S.catEnt:S.cats;sel.value=lista[0];
    perguntar('Nome da nova categoria','',n=>{if(!lista.includes(n)){lista.push(n);salvar()}sel.insertAdjacentHTML('afterbegin',`<option>${esc(n)}</option>`);
      [...sel.options].filter(o=>o.value===n).slice(1).forEach(o=>o.remove());sel.value=n})},
  novaFormaSel(sel,soCartao){if(sel.value!=='__novo')return;sel.selectedIndex=0;
    perguntar(soCartao?'Nome do cartão (ex.: Nubank, Itaú)':'Nome (ex.: Vale-refeição). Para cartão de crédito, use Ajustes › ＋ Cartão','',n=>{const f={id:uid(),nome:n,cartao:soCartao};S.formas.push(f);salvar();
      sel.insertAdjacentHTML('afterbegin',`<option value="${f.id}">${esc(soCartao?n:nomePag(f.id))}</option>`);sel.value=f.id})},
  novoCartao(){perguntar('Nome do cartão de crédito (ex.: Nubank, Itaú)','',n=>{S.formas.push({id:uid(),nome:n,cartao:true});salvar();render();A.prevParc();toast('Cartão cadastrado')})},
  novaForma(){perguntar('Nome da forma de pagamento','',n=>{S.formas.push({id:uid(),nome:n,cartao:false});salvar();render()})},
  editForma(id){const f=forma(id);const usos=S.gastos.filter(x=>x.pag===id).length+S.fixas.filter(x=>x.pag===id).length+S.parcelas.filter(x=>x.pag===id).length+S.financ.filter(x=>x.pag===id).length;
    const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box"><p>${f.cartao?'Cartão de crédito':'Forma de pagamento'}</p><div class="field"><input value="${esc(f.nome)}"></div>${f.cartao?`<div class="grid" style="margin-top:10px"><div><label>Dia do fechamento</label><div class="field"><input id="ffech" inputmode="numeric" placeholder="Ex.: 26" value="${f.fech||''}"></div></div><div><label>Dia do vencimento</label><div class="field"><input id="fvenc" inputmode="numeric" placeholder="Ex.: 5" value="${f.venc||''}"></div></div></div>`:''}<div class="hint">${usos} lançamento(s) usam esta forma.</div>
      <div class="btns"><button class="btn del" data-x>Excluir</button><button class="btn ghost" data-n>Cancelar</button><button class="btn" data-s>Salvar</button></div></div>`;
    const i=d.querySelector('input');d.querySelector('[data-n]').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};
    d.querySelector('[data-s]').onclick=()=>{const v=i.value.trim();if(v)f.nome=v;const ve=d.querySelector('#fvenc');if(ve){const dd=parseInt(ve.value,10);f.venc=dd>=1&&dd<=31?dd:null;const fe=parseInt(d.querySelector('#ffech').value,10);f.fech=fe>=1&&fe<=31?fe:null}salvar();render();d.remove()};
    d.querySelector('[data-x]').onclick=()=>{d.remove();if(usos)return toast('Em uso — não dá para excluir');if(S.formas.length<=1)return toast('Precisa ter ao menos uma');confirmar(`Excluir "${f.nome}"?`,()=>{S.formas=S.formas.filter(x=>x.id!==id);salvar();render()})};
    document.body.appendChild(d)},
  addCat(tipo){const l=tipo==='ent'?S.catEnt:S.cats;perguntar('Nome da nova categoria','',n=>{if(l.includes(n))return toast('Já existe');l.push(n);salvar();render()})},
  editCat(tipo,i){const l=tipo==='ent'?S.catEnt:S.cats,old=l[i];
    const emUso=tipo==='ent'?S.entradas.some(x=>x.cat===old):[...S.gastos,...S.fixas,...S.parcelas].some(x=>x.cat===old);
    const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box"><p>Categoria</p><div class="field"><input value="${esc(old)}"></div>
      <div class="btns"><button class="btn del" data-x>Excluir</button><button class="btn ghost" data-n>Cancelar</button><button class="btn" data-s>Salvar</button></div></div>`;
    const inp=d.querySelector('input');d.querySelector('[data-n]').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};
    d.querySelector('[data-s]').onclick=()=>{const n=inp.value.trim();d.remove();if(!n||n===old)return;if(l.includes(n))return toast('Já existe');l[i]=n;
      (tipo==='ent'?S.entradas:[...S.gastos,...S.fixas,...S.parcelas]).forEach(x=>{if(x.cat===old)x.cat=n});salvar();render()};
    d.querySelector('[data-x]').onclick=()=>{d.remove();if(emUso)return toast('Em uso — renomeie em vez de excluir');confirmar(`Excluir "${old}"?`,()=>{l.splice(i,1);salvar();render()})};
    document.body.appendChild(d)},
  async arquivo(nome,txt,tipo){const blob=new Blob([txt],{type:tipo});
    try{const f=new File([blob],nome,{type:tipo});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)},
  backup(){A.arquivo(`financas-backup-${hoje()}.json`,JSON.stringify(S),'application/json')},
  restaurar(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.v!==2||!d.gastos)throw 0;
    confirmar('Restaurar este backup? Os dados atuais serão substituídos.',()=>{S=d;migrar();salvar();render();toast('Backup restaurado')},'Restaurar')}catch(e){toast('Arquivo de backup inválido')}};r.readAsText(f)},
  csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',n=v=>String(r2(v)).replace('.',',');
    const L=[['Mês','Data','Tipo','Descrição','Categoria','Forma de pagamento','Parcela','Valor'].join(';')];
    const meses=new Set([...S.entradas,...S.gastos].map(x=>x.data.slice(0,7)));S.parcelas.forEach(p=>{for(let k=0;k<p.n;k++)meses.add(addMes(p.inicio,k))});
    S.fixas.forEach(f=>Object.keys(S.fixMes).forEach(m=>meses.add(m)));
    [...meses].sort().forEach(ym=>{
      entradasDoMes(ym).forEach(e=>L.push([ym,dataBR(e.data),'Entrada',q(e.desc),q(e.cat),'','',n(e.valor)].join(';')));
      S.fixas.filter(f=>fixaAtiva(f,ym)).forEach(f=>L.push([ym,'','Fixo',q(f.nome),q(f.cat),q(nomePag(f.pag)),'',n(-valorFixa(f,ym).v)].join(';')));
      S.parcelas.forEach(p=>{const k=parcelaNoMes(p,ym);if(k)L.push([ym,'','Parcelado',q(p.desc),q(p.cat),q(nomePag(p.pag)),`${k}/${p.n}`,n(-valorParcela(p,k))].join(';'))});
      S.financ.forEach(f=>{const k=parcFin(f,ym);if(k)L.push([ym,'','Financiamento',q(f.nome),'Financiamento',q(nomePag(f.pag)),`${k}/${f.n}`,n(-valorFin(f,ym).v)].join(';'))});
      S.gastos.filter(g=>g.data.slice(0,7)===ym).forEach(g=>L.push([ym,dataBR(g.data),'Gasto geral',q(g.desc),q(g.cat),q(nomePag(g.pag)),'',n(-g.valor)].join(';')))});
    Object.keys(S.guardado).sort().forEach(ym=>L.push([ym,'','Guardado (saldo)','','','','',n(S.guardado[ym])].join(';')));
    A.arquivo(`financas-${hoje()}.csv`,'﻿'+L.join('\r\n'),'text/csv')},
  levarSobra(){const ym=UI.mes,G=soma(gastosDoMes(ym)),R=soma(entradasDoMes(ym).filter(e=>true)),sobra=r2(R-G),l=sobraLevada(ym),prox=addMes(ym,1);
    const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box"><p>Quanto levar para ${nomeMes(prox).toLowerCase()}?</p><div class="field money"><span>R$</span><input inputmode="decimal" value="${num(l?Math.max(sobra,0)||l.valor:sobra)}"></div><div class="hint">Vira uma entrada "${CAT_SOBRA}" no dia 1º. Pode levar só uma parte.</div><div class="btns"><button class="btn ghost" data-n>Cancelar</button><button class="btn" data-s>Levar</button></div></div>`;
    const i=d.querySelector('input');d.querySelector('[data-n]').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};
    d.querySelector('[data-s]').onclick=()=>{const v=lerValor(i.value);d.remove();if(!v)return toast('Informe o valor');
      if(!S.catEnt.includes(CAT_SOBRA))S.catEnt.push(CAT_SOBRA);
      const o={valor:v,data:prox+'-01',desc:'Sobra de '+nomeMes(ym).toLowerCase(),cat:CAT_SOBRA,sobraDe:ym};
      if(l)Object.assign(l,o);else S.entradas.push({id:uid(),criado:Date.now(),...o});salvar();render();toast('Levado para '+curto(prox))};
    document.body.appendChild(d);setTimeout(()=>i.select(),50)},
  desfazerSobra(){const l=sobraLevada(UI.mes);confirmar('Remover a sobra levada para o próximo mês?',()=>{S.entradas=S.entradas.filter(e=>e!==l);salvar();render()},'Remover')},
  salvarGuardado(s){const t=String(s).trim();if(!t)delete S.guardado[UI.mes];else S.guardado[UI.mes]=lerValor(t);salvar();render();toast('Guardado atualizado')},
  repetirGuardado(){const g=guardadoMes(UI.mes);if(g.v!=null){S.guardado[UI.mes]=g.v;salvar();render()}},
  zerar(){confirmar('Apagar TODOS os dados deste iPhone? Faça um backup antes.',()=>setTimeout(()=>confirmar('Tem certeza? Não dá para desfazer.',()=>{S=padrao();salvar();render();toast('Dados apagados')},'Apagar tudo'),60),'Continuar')}
};

render();A.prevParc();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
